name: sdist round-trip

on:
  push:
    branches: [main]
  pull_request:

jobs:
  round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -q build
      - run: python -m build
      - name: Build a wheel from the generated sdist only
        run: |
          mkdir -p /tmp/roundtrip /tmp/roundtrip-wheel
          tar -xzf dist/*.tar.gz -C /tmp/roundtrip
          cd /tmp/roundtrip/*/ && python -m build --wheel --outdir /tmp/roundtrip-wheel
      - name: Install that wheel in a fresh venv and drive the CLI
        run: |
          python -m venv /tmp/rtvenv
          /tmp/rtvenv/bin/pip install --disable-pip-version-check -q /tmp/roundtrip-wheel/*.whl
          /tmp/rtvenv/bin/ainative --version
          mkdir -p /tmp/rtproj
          cd /tmp && /tmp/rtvenv/bin/ainative init --profile standard --project /tmp/rtproj --dry-run