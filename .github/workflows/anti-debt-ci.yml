name: Anti-Debt Validation

on:
  push:
    paths:
      - 'stack/agents/anti-debt/**'
  pull_request:
    paths:
      - 'stack/agents/anti-debt/**'

jobs:
  validate-schemas:
    name: Validate JSON schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate JSON schemas
        working-directory: stack/agents/anti-debt
        run: |
          python3 -c "
          import json, glob
          for f in glob.glob('schemas/*.json'):
              with open(f) as fh:
                  json.load(fh)
              print('OK:', f)
          "

      - name: Validate taxonomy
        working-directory: stack/agents/anti-debt
        run: |
          python3 -c "
          import yaml
          d = yaml.safe_load(open('taxonomy/debt-categories.yaml'))
          cats = [k for k in d if not k.startswith('severity')]
          assert len(cats) >= 4, f'Expected >=4 categories, got {len(cats)}'
          print(f'OK: {len(cats)} categories')
          "

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate real scanner output conforms to schema
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_schema_conformance.py

  test-critic:
    name: Test Critic Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run critic tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_critic_blocks_hallucinations.py

      - name: Run anti-MVP tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_no_mvp_regression.py

  test-tools-syntax:
    name: Test Python tools syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Syntax check (all Python: tools, kg, skills)"
        working-directory: stack/agents/anti-debt
        run: |
          python3 -c "
          import ast, glob
          files = (glob.glob('tools/*.py') + glob.glob('kg/**/*.py', recursive=True)
                   + glob.glob('skills/**/*.py', recursive=True))
          for f in files:
              ast.parse(open(f, encoding='utf-8').read(), filename=f)
              print('OK:', f)
          assert files, 'no Python files found'
          "

  test-scan-quality:
    name: Test scan quality (corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run scan quality test
        working-directory: stack/agents/anti-debt
        # Enforced: the test asserts recall >= 0.70 and precision >= 0.60.
        run: python3 tests/test_scan_quality.py

  test-layer0-kg:
    name: Test Layer 0 (Knowledge Graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Layer 0 tests
        working-directory: stack/agents/anti-debt
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'kg')
          sys.path.insert(0, 'kg/tests')
          import unittest
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromName('test_kg')
          runner = unittest.TextTestRunner(verbosity=2)
          result = runner.run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          "

  test-layer12:
    name: Test Layer 1+2 (static analysis + critic V2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Layer 1+2 tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_layer12.py

  test-adapters:
    name: Test adapters validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run adapter tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_adapters.py

  test-layer3-v12:
    name: Test Layer 3 (V1.2 skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Layer 3 V1.2 tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_skills_v12.py

  test-layer47:
    name: Test Layer 4+6+7 (orchestration, calibration, dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Layer 4+6+7 tests
        working-directory: stack/agents/anti-debt
        run: python3 tests/test_layer47.py

  test-dashboard-e2e:
    name: Test dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scan_periodic + dashboard
        working-directory: stack/agents/anti-debt
        run: |
          # End-to-end: scan a tiny project, persist to KG, render dashboard
          mkdir -p /tmp/dash-test/src
          echo 'API_KEY = "d3adb33fc4fef00d1234567890abcdef"' > /tmp/dash-test/src/config.py
          cat > /tmp/dash-test/projects.test.json <<EOF
          [{"name": "dash-test", "path": "/tmp/dash-test", "enabled": true, "scan_layers": [1, 3], "alert": {}}]
          EOF
          python3 tools/scan_periodic.py --config /tmp/dash-test/projects.test.json --once
          python3 tools/dashboard.py
          test -f tools/dashboard.html || (echo "dashboard.html not generated" && exit 1)
          test -s tools/dashboard.html || (echo "dashboard.html is empty" && exit 1)
          echo "OK: dashboard generated $(wc -c < tools/dashboard.html) bytes"
