name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -q build
      - run: python -m build
      - name: Write SHA256SUMS
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber