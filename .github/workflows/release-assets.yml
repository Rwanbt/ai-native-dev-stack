name: Release assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: The tag must point at the current main
        # A release promotes a qualified main SHA. Publishing a tag main does
        # not carry would distribute a tree nobody reviewed there.
        run: |
          set -e
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: The tag must name the version the tree declares
        # The tag is as much a version label as VERSION and __version__ are.
        # Without this gate a v2.2.2 tag could publish an
        # ainative-dev-stack-2.2.1.zip beside a 2.2.2 release (AUD-201), and
        # every check downstream would still pass.
        run: python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
      - run: python -m pip install --disable-pip-version-check -q build
      - name: Build the wheel and sdist (refuses a two-version tree)
        # _build_backend refuses to stage when VERSION and ainative.__version__
        # disagree; the artifact cannot exist if the invariant is broken.
        run: python -m build
      - name: Build the lifecycle bundle consumed by `ainative update`
        run: python scripts/build_lifecycle_bundle.py
      - name: Every built artifact must carry the release version
        # Filenames, wheel METADATA, sdist PKG-INFO and the protocol document
        # and payload VERSION inside the bundle.
        run: python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}" --dist dist
      - name: Write SHA256SUMS
        run: cd dist && sha256sum *.whl *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Attest the build provenance of every artifact
        # Standard, verifiable, automatable: GitHub attests that these bytes
        # were produced by this workflow, in this repository, at this commit.
        # Clients verify with `gh attestation verify <file> -R <repo>`.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
      - name: Create the release as a draft
        # Draft first: a release uploaded asset by asset is briefly visible
        # with a partial set. Nothing is published until every asset is up and
        # verified. No --clobber: an existing asset of the same name must fail
        # the publish loudly, never be silently replaced.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
                 --title "${GITHUB_REF_NAME}"
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "true"
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
      - name: Verify the uploaded assets, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view "${GITHUB_REF_NAME}" --json assets > dist/assets.json
          python scripts/check_published_assets.py --dist dist --assets-json dist/assets.json
          gh release edit "${GITHUB_REF_NAME}" --draft=false