name: Publish to PyPI

# Standard distribution path: installable with
#     pip install ainative-dev-stack==<version>
# via PyPI Trusted Publishing (OIDC), not a long-lived API token.
#
# One-time setup by the maintainer (external to this repository):
#   1. Create the project on PyPI (first upload) or reserve the name;
#   2. PyPI -> Account -> Publishing -> add a trusted publisher for:
#        owner: Rwanbt      repository: ai-native-dev-stack
#        workflow: publish-pypi.yml    environment: pypi
#   3. Create the `pypi` environment in the repository settings (no secrets:
#      OIDC only).
# See docs/RELEASING.md.
#
# Until the trusted publisher exists PyPI rejects the upload with
# `invalid-publisher`; the GitHub Release path (release-assets.yml) is
# unaffected and keeps working.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v2.3.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ainative-dev-stack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: The tag must name the version the tree declares
        run: |
          set -e
          python scripts/check_release_versions.py --tag "${{ github.event.release.tag_name || inputs.tag }}"
      - run: python -m pip install --disable-pip-version-check -q build
      - name: Build the wheel and sdist
        run: python -m build
      - name: Both artifacts must carry the release version
        # PyPI ships the wheel and the sdist, not the lifecycle bundle; the
        # gate checks the same label chain for the half being published.
        run: python scripts/check_release_versions.py --tag "${{ github.event.release.tag_name || inputs.tag }}" --dist dist --without-bundle
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist